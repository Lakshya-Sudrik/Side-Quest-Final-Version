  <body class="bg-[#efe9d7] text-[#343723] antialiased selection:bg-[#898861] selection:text-[#efe9d7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for offline support
      const deployedSecureOrigin = location.protocol === 'https:' && !['localhost', '127.0.0.1'].includes(location.hostname);
      if ('serviceWorker' in navigator && deployedSecureOrigin) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
