     [.4, `<rect x="${x(-170)}" y="454" width="360" height="230" fill="${MID}"/><path d="M${x(-20)},474 L${x(44)},474 M${x(-8)},492 L${x(32)},492 M${x(2)},510 L${x(22)},510 M${x(-90)},484 L${x(-60)},484 M${x(60)},500 L${x(96)},500" stroke="${CANDLE}" stroke-width="3" stroke-linecap="round" opacity=".75"/>`],
     [.9, `<path d="M${x(-170)},584 C${x(-60)},560 ${x(60)},572 ${x(170)},594 L${x(170)},680 L${x(-170)},680 Z" fill="${NEAR}"/>${gouge([[20,590,60,596]])}`],
     [1.2, `<g fill="${NEAR}"><path d="M${x(-52)},596 C${x(-50)},524 ${x(-34)},454 ${x(-10)},404 L${x(-4)},407 C${x(-26)},458 ${x(-40)},524 ${x(-42)},596 Z"/><path d="M${x(-8)},404 C${x(-40)},384 ${x(-72)},392 ${x(-86)},414 C${x(-60)},402 ${x(-34)},402 ${x(-8)},408 Z M${x(-8)},404 C${x(20)},380 ${x(54)},386 ${x(66)},410 C${x(40)},398 ${x(16)},400 ${x(-6)},410 Z M${x(-8)},404 C${x(-24)},374 ${x(-16)},352 ${x(4)},340 C${x(-6)},362 ${x(-6)},382 ${x(-4)},404 Z M${x(-8)},406 C${x(-44)},408 ${x(-60)},432 ${x(-58)},454 C${x(-46)},432 ${x(-28)},418 ${x(-6)},410 Z M${x(-6)},406 C${x(30)},408 ${x(46)},432 ${x(44)},454 C${x(32)},432 ${x(16)},418 ${x(-4)},410 Z"/></g>`]],
    [[.12, sun(40, 302, 26)],
     [.35, `<path d="M${x(-70)},464 L${x(-70)},436 L${x(-62)},436 L${x(-62)},416 L${x(-54)},416 L${x(-54)},396 L${x(-46)},396 L${x(-46)},380 L${x(-38)},380 L${x(-38)},368 L${x(-26)},368 L${x(-26)},380 L${x(-18)},380 L${x(-18)},396 L${x(-10)},396 L${x(-10)},416 L${x(-2)},416 L${x(-2)},436 L${x(6)},436 L${x(6)},464 Z" fill="url(#hatchD)" stroke="${MID}" stroke-width="2.4"/><path d="M${x(-160)},476 C${x(-60)},462 ${x(60)},462 ${x(170)},474 L${x(170)},680 L${x(-160)},680 Z" fill="url(#hatchD)"/>`],
     [.65, `<g fill="${MID}"><ellipse cx="${x(60)}" cy="484" rx="44" ry="34"/><ellipse cx="${x(104)}" cy="490" rx="36" ry="28"/><ellipse cx="${x(80)}" cy="450" rx="26" ry="22"/><ellipse cx="${x(-110)}" cy="496" rx="40" ry="30"/><rect x="${x(-170)}" y="494" width="360" height="190"/></g>${gouge([[40,470,70,462],[90,486,116,480]], CANDLE, 2.2)}`],
     [1, `<g fill="${NEAR}"><ellipse cx="${x(-60)}" cy="580" rx="62" ry="44"/><ellipse cx="${x(-2)}" cy="558" rx="34" ry="30"/><ellipse cx="${x(50)}" cy="586" rx="58" ry="40"/><ellipse cx="${x(-40)}" cy="532" rx="24" ry="20"/><rect x="${x(-170)}" y="584" width="360" height="100"/></g>${gouge([[-80,556,-50,548],[30,572,64,566],[-14,546,6,542]])}`]]
  ];
  const scenesMarkup = `<rect x="${CX-200}" y="160" width="400" height="520" fill="url(#hatchSky)"/>` +
    SCENES.map(layers => `<g class="scene" opacity="0"><g transform="translate(${CX} 250) scale(.9) translate(${-CX} -290)">${layers.map(([dep,g]) => `<g class="ly" data-d="${dep}">${g}</g>`).join('')}</g></g>`).join('');

  // shared rotation clock: a new view every 2 s, 0.7 s crossfade
  const PERIOD = 2000, FADE = 700;
  let clock0 = null;
  function sceneOpacities(now){
    if (clock0 === null) return SCENES.map((_,i) => i === 0 ? 1 : 0);
    const e = Math.max(0, now - clock0), i = Math.floor(e / PERIOD) % SCENES.length, prev = (i + SCENES.length - 1) % SCENES.length;
    const f = e < PERIOD ? 1 : Math.min(1, (e % PERIOD) / FADE), k = f < .5 ? 2*f*f : 1 - Math.pow(-2*f+2,2)/2;
    return SCENES.map((_,j) => j === i ? k : j === prev ? 1 - k : 0);
  }
  function driveScenes(root, now){
    const o = sceneOpacities(now);
    root.querySelectorAll('.scene').forEach((s,i) => s.setAttribute('opacity', o[i].toFixed(3)));
    const t = now / 1000, sx = reduce ? 0 : Math.sin(t*.5)*.4, sy = reduce ? 0 : Math.cos(t*.4)*.25;
    root.querySelectorAll('.ly').forEach(l => { const d = +l.dataset.d; l.setAttribute('transform', `translate(${(-sx*26*d).toFixed(2)} ${(-sy*12*d).toFixed(2)})`); });
  }

  // ================= docked logo (top-left) =================
  const dsvg = $('dsvg');
  dsvg.innerHTML = `<defs>
      <filter id="dInk" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
      <clipPath id="dWin"><path d="${OPEN}"/></clipPath></defs>
    ${LETTERS}<path d="${OPEN}" fill="${CANDLE}"/>
    <g clip-path="url(#dWin)"><g filter="url(#rough)">${scenesMarkup}</g></g>
    <g filter="url(#dInk)">${ARCH}</g>`;

  // ================= intro =================
  const intro = $('intro'), isvg = $('isvg');
  $('iLetters').innerHTML = LETTERS;
  $('iFrame').innerHTML = ARCH;
  $('iWinPath').setAttribute('d', OPEN); $('iDoorway').setAttribute('d', OPEN);
  $('iScenes').innerHTML = scenesMarkup;
  $('iDoorL').setAttribute('x', IL);

  const P = {"mumbai": [110.8, 415.4], "pune": [129.5, 426.7], "satara": [132.2, 443.6], "kolhapur": [136.8, 463.3], "belagavi": [141.8, 480.3], "hubballi": [153.7, 490], "davangere": [169, 507.8], "chitradurga": [178.2, 512.4], "tumakuru": [191.6, 529.9], "blr": [201, 537.2]}, MHC = [172.8, 407.5], KAC = [173.6, 502.3];
  const order = ['mumbai','pune','satara','kolhapur','belagavi','hubballi','davangere','chitradurga','tumakuru','blr'];
  const pts = order.map(k => P[k]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2, k = 1/6;
    d += ` C${(p1[0]+(p2[0]-p0[0])*k).toFixed(2)},${(p1[1]+(p2[1]-p0[1])*k).toFixed(2)} ${(p2[0]-(p3[0]-p1[0])*k).toFixed(2)},${(p2[1]-(p3[1]-p1[1])*k).toFixed(2)} ${p2[0]},${p2[1]}`;
  }
  ['iRoad','iRoadDash','iReveal','iMeasure'].forEach(id => $(id).setAttribute('d', d));
  const measure = $('iMeasure'), L = measure.getTotalLength();
  $('iReveal').setAttribute('stroke-dasharray', `${L} ${L}`);

  const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
  const seg = (t,a,b) => clamp((t-a)/(b-a));
  const lerp = (a,b,t) => a + (b-a)*t;
  const eIO = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  const eOut = t => 1 - Math.pow(1-t,3);
  const eIn = t => t*t*t;
  const eSine = t => -(Math.cos(Math.PI*t)-1)/2;
  const eBack = t => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };

  const BLR = P.blr;
  const CAM0 = {s:1.15, x:300, y:342}, CAM1 = {s:3.0, x:168, y:462}, CAM2 = {s:5.4, x:BLR[0], y:BLR[1] - 190/5.4};
  const T = { driveA:4.8, driveB:9.0, landA:13.9, landB:15.3, dockA:18.6, dockB:19.9, end:20.1 };
  function cam(t){
    const z = eIO(seg(t,3.1,4.7)), z2 = eIO(seg(t,9.3,10.7));
    const c = { s: lerp(CAM0.s,CAM1.s,z), x: lerp(CAM0.x,CAM1.x,z), y: lerp(CAM0.y,CAM1.y,z) };
    return { s: Math.exp(lerp(Math.log(c.s), Math.log(CAM2.s), z2)), x: lerp(c.x, CAM2.x, z2), y: lerp(c.y, CAM2.y, z2) };
  }
  const toS = (c,[x,y]) => [(x-c.x)*c.s + 800, (y-c.y)*c.s + 450];
  const driveP = t => eSine(seg(t,T.driveA,T.driveB));
  function routeAt(p){
    const l = clamp(p)*L, a = measure.getPointAtLength(l), b = measure.getPointAtLength(Math.min(L,l+1.5)), c = measure.getPointAtLength(Math.max(0,l-1.5));
    return { x:a.x, y:a.y, ang: Math.atan2(b.y-c.y, b.x-c.x)*180/Math.PI };
  }
  const op = (id,v) => $(id).setAttribute('opacity', (+v).toFixed(3));
  const at = (el,x,y,extra='') => el.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})${extra}`);
  const puffs = Array.from({length:8}, () => { const c = document.createElementNS(NS,'circle'); c.setAttribute('fill','#343723'); $('iPuffs').appendChild(c); return c; });

  // logo placements in intro coordinates: {s, tx, ty} maps mark coords → intro coords
  const BIG = (() => { const s = 0.66, cx = 646, cy = 500; return { s, tx: 800 - cx*s, ty: 450 - cy*s }; })();
  function dockTarget(){
    const I = isvg.getScreenCTM(), M = dsvg.getScreenCTM();
    return { s: M.a / I.a, tx: (M.e - I.e) / I.a, ty: (M.f - I.f) / I.d };
  }
  const mix = (A, B, f, arc = 0) => ({ s: Math.exp(lerp(Math.log(A.s), Math.log(B.s), f)), tx: lerp(A.tx, B.tx, f), ty: lerp(A.ty, B.ty, f) - Math.sin(f*Math.PI)*arc });
  let DOCK = null, clockSetAt = null;
  let landingPrepared = false, prepareHomeSent = false;

  function render(t, now){
    if (t >= T.dockA - 1.2 && !prepareHomeSent && window.parent !== window) {
      window.parent.postMessage({ type: 'sidequest:intro:prepare-home' }, window.location.origin);
      prepareHomeSent = true;
    }
    const c = cam(t);
    $('iMap').setAttribute('transform', `translate(800 450) scale(${c.s.toFixed(4)}) translate(${-c.x} ${-c.y})`);
    op('iMap', (1 - .72*eIO(seg(t,10.0,11.0))) * (1 - eIO(seg(t,12.6,13.6))));
    $('iOutline').setAttribute('stroke-dashoffset', (1 - eIO(seg(t,.2,2.0))).toFixed(4));
    op('iLand', eOut(seg(t,1.0,2.1))); op('iMesh', .9*eOut(seg(t,1.5,2.3)));
    op('iMh', eOut(seg(t,2.0,2.8))); op('iKa', eOut(seg(t,2.5,3.2)));

    const A = toS(c,P.mumbai), B = toS(c,BLR), lblOut = 1 - eOut(seg(t,9.6,10.3));
    at($('iPinA'), A[0], A[1] - (1-eBack(seg(t,2.3,2.8)))*18); op('iPinA', seg(t,2.3,2.5)*lblOut);
    at($('iPinB'), B[0], B[1] - (1-eBack(seg(t,2.8,3.3)))*18); op('iPinB', seg(t,2.8,3.0)*(1 - eOut(seg(t,10.2,10.8))));
    at($('iLblA'), A[0], A[1]); op('iLblA', eOut(seg(t,2.5,3.0))*lblOut);
    at($('iLblB'), B[0], B[1]); op('iLblB', eOut(seg(t,3.0,3.5))*lblOut);
    const MS = toS(c,MHC), KS = toS(c,KAC);
    $('iMhL').setAttribute('x', MS[0]+40); $('iMhL').setAttribute('y', MS[1]-10);
    $('iKaL').setAttribute('x', KS[0]+78); $('iKaL').setAttribute('y', KS[1]+20);
    op('iMhL', eOut(seg(t,4.0,4.6))*lblOut); op('iKaL', eOut(seg(t,4.2,4.8))*lblOut);

    const p = driveP(t);
    $('iReveal').setAttribute('stroke-dashoffset', (L - p*L).toFixed(3));
    op('iOdo', eOut(seg(t,4.5,5.0)) * lblOut);
    $('iOdoNum').textContent = Math.round(984*p) + ' km';
    const r = routeAt(p), R = toS(c,[r.x,r.y]);
    const driving = t > T.driveA && t < T.driveB;
    const tilt = clamp(r.ang*0.15, -6, 8) * (1 - eIO(seg(t,9.2,10.0)));
    const arr = seg(t,T.driveB,T.driveB+.7), settle = arr>0 && arr<1 ? Math.sin(arr*Math.PI*3)*(1-arr)*2.2 : 0;
    const bob = driving ? Math.sin(t*34)*0.9 : 0, inside = t >= 12.0;
    op('iRickOut', inside ? 0 : seg(t,4.3,4.45));
    at($('iRickOut'), R[0], R[1], ` rotate(${tilt.toFixed(2)}) scale(${eBack(seg(t,4.3,4.8)).toFixed(4)})`);
    $('iRickOutBob').setAttribute('transform', `translate(0 ${(bob - settle).toFixed(2)})`);
    const spin = p*L*48 + eIn(seg(t,12.0,13.2))*900;
    isvg.querySelectorAll('#iRick .spin').forEach(el => el.setAttribute('transform', `rotate(${spin.toFixed(1)})`));
    puffs.forEach((el,i) => {
      el.setAttribute('opacity', 0);
      for (let k = T.driveA + .1 + i*.15; k < T.driveB - .2; k += puffs.length*.15) {
        const age = t - k;
        if (age >= 0 && age < .8) { const q = routeAt(driveP(k)), Q = toS(c,[q.x,q.y]), a = age/.8;
          el.setAttribute('cx', (Q[0]-58-a*16).toFixed(1)); el.setAttribute('cy', (Q[1]-14-a*10).toFixed(1)); el.setAttribute('r', (2+a*4.5).toFixed(2)); el.setAttribute('opacity', (.12*(1-a)).toFixed(3)); }
      }
    });
    const pu = seg(t,T.driveB+.05,T.driveB+1.0), pc = $('iPulse');
    pc.setAttribute('cx', B[0]); pc.setAttribute('cy', B[1]);
    pc.setAttribute('r', (10 + eOut(pu)*38).toFixed(2)); pc.setAttribute('opacity', (pu>0 && pu<1 ? (1-pu)*.9 : 0).toFixed(3));

    // logo transform: gateway at Bengaluru → big centred logo → docked top-left
    const GATE = { s: .95, tx: B[0] - CX*.95, ty: B[1] + 4 - 543*.95 };
    let X = GATE;
    if (t >= T.landA) X = mix(GATE, BIG, eIO(seg(t,T.landA,T.landB)), 40);
    if (t >= T.dockA && landingPrepared) { if (!DOCK) DOCK = dockTarget(); X = mix(BIG, DOCK, eIO(seg(t,T.dockA,T.dockB)), 0); }
    $('iLogo').setAttribute('transform', `matrix(${X.s.toFixed(5)} 0 0 ${X.s.toFixed(5)} ${X.tx.toFixed(2)} ${X.ty.toFixed(2)})`);
    op('iLogo', t >= 10.3 ? 1 : 0);
    const rise = eOut(seg(t,10.3,11.2));
    $('iRiseRect').setAttribute('y', (563 - rise * 460).toFixed(1)); $('iRiseRect').setAttribute('height', (rise * 460 + 10).toFixed(1));

    // doors: open for the auto, close, then open for good once the logo has formed
    const door = Math.max(eIO(seg(t,11.3,12.0)) * (1 - eIO(seg(t,13.2,13.8))), eIO(seg(t,16.2,16.9)));
    const wl = (CX - IL) * (1 - door), wr = (IR - CX) * (1 - door);
    $('iDoorL').setAttribute('width', wl.toFixed(2));
    $('iDoorR').setAttribute('x', (IR - wr).toFixed(2)); $('iDoorR').setAttribute('width', wr.toFixed(2));
    op('iRoadView', t < 14 ? Math.min(1, door*1.6) : 0);
    op('iScenes', t >= 16 ? Math.min(1, door*1.6) : 0);
    if (t >= 16.9 && clockSetAt === null) { clockSetAt = t; clock0 = now; }
    driveScenes($('iScenes'), now);

    const g = eIn(seg(t,12.0,13.2));
    const inS = lerp(1/.95, .09/.95, g), inY = lerp(543 - 16, 432, eOut(seg(t,12.0,13.2)));
    $('iRickIn').setAttribute('transform', `translate(${CX} ${inY.toFixed(2)}) scale(${inS.toFixed(4)})`);
    $('iRickIn').setAttribute('opacity', inside && t < 13.25 ? 1 : 0);
    $('iRickInBob').setAttribute('transform', `translate(0 ${(Math.sin(t*34)*0.9).toFixed(2)})`);

    // letters form around the landed arch
    const lt = eOut(seg(t,15.1,16.1));
    op('iLetters', lt);
    $('iLetters').style.transform = `translateY(${((1-lt)*22).toFixed(2)}px)`;

    // the 16:9 frame dissolves as the logo docks
    const fo = 1 - eIO(seg(t,T.dockA,T.dockB - .2));
    $('frame').style.opacity = 1; $('frame').style.background = `rgba(239,233,215,${fo.toFixed(3)})`;
    $('frame').style.boxShadow = `0 20px 60px rgba(52,55,35,${(.18*fo).toFixed(3)})`;
    intro.style.background = `rgba(227,219,194,${fo.toFixed(3)})`;
    $('frame').classList.toggle('fading', fo < 1);
  }

  // ================= playback =================
  let start = null, done = false, finishedAt = null;
  function finish(now){
    if (done) return;
    render(T.end, now);
    done = true; finishedAt = now; intro.hidden = true;
    document.documentElement.classList.add('intro-complete');
    if (clock0 === null) clock0 = now;
    $('dock').style.opacity = 1;
    if (window.parent !== window) window.parent.postMessage({ type: 'sidequest:intro:complete' }, window.location.origin);
  }
  function loop(now){
    if (!done) {
      if (start === null) start = now;
      const t = (now - start) / 1000;
      if (t >= T.end) finish(now); else render(t, now);
    }
    driveScenes(dsvg, now);
    if (!done || (finishedAt !== null && now - finishedAt < 1800)) requestAnimationFrame(loop);
  }
  intro.addEventListener('click', () => finish(performance.now()));
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.origin !== window.location.origin) return;
    if (event.data?.type === 'sidequest:intro:home-ready') landingPrepared = true;
    if (event.data?.type === 'sidequest:intro:skip') finish(performance.now());
  });
  window.__seek = t => { render(t, performance.now()); };
  const go = () => { if (reduce) finish(performance.now()); requestAnimationFrame(loop); };
  if (window.__noAuto) { render(0, performance.now()); return; }
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]) : Promise.resolve()).then(go);
})();
</script>
